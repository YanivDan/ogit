[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ogit"
version = "0.2.0"
description = "AI-powered Git commit message generator with Ollama - smarter commits, offline"
authors = [
    { name = "Yaniv Dan", email = "yanivdezan@gmail.com" }
]
dependencies = [
    "requests>=2.25.0",
    "pyperclip>=1.8.0"
]
readme = "README.md"
requires-python = ">=3.8"
keywords = ["git", "commit", "ai", "ollama", "automation", "conventional-commits"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]

[project.urls]
Homepage = "https://github.com/YanivDan/ogit"
Repository = "https://github.com/YanivDan/ogit"
"Bug Tracker" = "https://github.com/YanivDan/ogit/issues"

[project.scripts]
ogit = "ogit.main:cli_entrypoint"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=1.0.0",
    "pre-commit>=2.0.0"
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=ogit --cov-report=term-missing"
testpaths = ["tests"]
